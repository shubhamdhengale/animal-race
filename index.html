<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Rush: Wild Evolution</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; display:flex; align-items:center; justify-content:center; height:100%; font-family: Arial, sans-serif; }
  #game-container { box-shadow: 0 0 30px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="game-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>

const WIDTH = 800;
const HEIGHT = 400;
const GROUND_Y = 340;
const FINISH_DISTANCE = 1500;
const BIOME_1_END = 500;
const BIOME_2_END = 1000;
const BASE_SPEED = 220;

const ANIMALS = {
  rabbit:  { emoji: '🐇', name: 'Rabbit',  jumpVel: -520, ability: 'highjump',   desc: 'Big jumps - great on cliffs' },
  penguin: { emoji: '🐧', name: 'Penguin', jumpVel: -380, ability: 'slide',      desc: 'Slides fast on ice' },
  frog:    { emoji: '🐸', name: 'Frog',    jumpVel: -480, ability: 'doublejump', desc: 'Huge jumps, fast in water' },
  monkey:  { emoji: '🐒', name: 'Monkey',  jumpVel: -420, ability: 'doublejump', desc: 'Can jump twice in the air' },
  elephant:{ emoji: '🐘', name: 'Elephant',jumpVel: -380, ability: 'smash',      desc: 'Smashes rocks instead of dying' }
};
const ALL_KEYS = Object.keys(ANIMALS);

// Which animal the environment auto-picks per biome
const BIOME_ANIMAL = { forest: 'rabbit', snow: 'penguin', river: 'frog' };

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    this.animalKey = 'rabbit';
    this.animal = ANIMALS[this.animalKey];
    this.currentBiome = 'forest';
    this.score = 0;
    this.distance = 0;
    this.gameOver = false;
    this.gameWon = false;
    this.jumpsUsed = 0;
    this.maxJumps = 1;
    this.hasShield = false;
    this.speedMultiplier = 1;
    this.speedBoostTimer = null;
    this.choosing = false;
    this.jumpKeyWasDown = false;
    this.legAngle = 0;

    this.buildGroundTextures();

    this.sky = this.add.rectangle(WIDTH/2, HEIGHT/2, WIDTH, HEIGHT, 0x87CEEB);
    this.ground = this.add.tileSprite(WIDTH/2, GROUND_Y + 30, WIDTH, 60, 'forestTex');

    const groundBody = this.physics.add.staticGroup();
    const groundCollider = this.add.rectangle(WIDTH/2, GROUND_Y + 10, WIDTH, 20, 0x000000, 0);
    groundBody.add(groundCollider);

    // Player (fixed Y baseline - no body bounce)
    this.playerY = GROUND_Y - 40;
    this.player = this.add.text(120, this.playerY, this.animal.emoji, { fontSize: '48px' }).setOrigin(0.5);
    this.baseScaleX = -1; // faces right
    this.player.setScale(this.baseScaleX, 1);
    this.physics.add.existing(this.player);
    this.player.body.setSize(36, 40);
    this.player.body.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, groundBody, () => { this.jumpsUsed = 0; });

    // Legs: two small rectangles that swing like a pendulum from a hip point
    this.legL = this.add.rectangle(this.player.x - 6, GROUND_Y - 6, 6, 16, 0x333333).setOrigin(0.5, 0);
    this.legR = this.add.rectangle(this.player.x + 6, GROUND_Y - 6, 6, 16, 0x333333).setOrigin(0.5, 0);

    // Groups
    this.obstacles = this.physics.add.group();
    this.coins = this.physics.add.group();
    this.orbs = this.physics.add.group();
    this.powerUps = this.physics.add.group();

    this.physics.add.overlap(this.player, this.obstacles, this.hitObstacle, null, this);
    this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
    this.physics.add.overlap(this.player, this.orbs, this.collectOrb, null, this);
    this.physics.add.overlap(this.player, this.powerUps, this.collectPowerUp, null, this);

    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    // UI
    this.animalLabel = this.add.text(16, 16, this.animal.name + ' ' + this.animal.emoji, { fontSize: '18px', fill: '#000', fontStyle: 'bold' });
    this.scoreText = this.add.text(16, 44, 'Coins: 0', { fontSize: '20px', fill: '#000', fontStyle: 'bold' });
    this.distanceText = this.add.text(16, 70, 'Distance: 0 / ' + FINISH_DISTANCE, { fontSize: '20px', fill: '#000', fontStyle: 'bold' });
    this.biomeText = this.add.text(WIDTH - 16, 16, '🌳 Forest', { fontSize: '20px', fill: '#000', fontStyle: 'bold' }).setOrigin(1, 0);
    this.statusText = this.add.text(WIDTH - 16, 44, '', { fontSize: '16px', fill: '#000', fontStyle: 'bold' }).setOrigin(1, 0);
    this.transformNotice = this.add.text(WIDTH/2, 100, '', { fontSize: '22px', fill: '#fff', fontStyle: 'bold', backgroundColor: '#000000aa', padding: { x: 14, y: 6 } }).setOrigin(0.5).setVisible(false);

    this.messageText = this.add.text(WIDTH/2, HEIGHT/2, '', { fontSize: '30px', fill: '#fff', fontStyle: 'bold', backgroundColor: '#000000aa', padding: { x: 20, y: 10 }, align: 'center' });
    this.messageText.setOrigin(0.5);
    this.messageText.setVisible(false);

    // Timers
    this.obstacleTimer = this.time.addEvent({ delay: 1400, callback: this.spawnObstacle, callbackScope: this, loop: true });
    this.coinTimer = this.time.addEvent({ delay: 900, callback: this.spawnCoin, callbackScope: this, loop: true });
    this.orbTimer = this.time.addEvent({ delay: 9000, callback: this.spawnOrb, callbackScope: this, loop: true });
    this.powerUpTimer = this.time.addEvent({ delay: 7000, callback: this.spawnPowerUp, callbackScope: this, loop: true });

    this.input.on('pointerdown', () => { if ((this.gameOver || this.gameWon) && !this.choosing) this.scene.restart(); });
    this.input.keyboard.on('keydown-R', () => { if ((this.gameOver || this.gameWon) && !this.choosing) this.scene.restart(); });

    this.transformGroup = [];
  }

  buildGroundTextures() {
    if (this.textures.exists('forestTex')) return;
    const make = (key, base, stripe) => {
      const g = this.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(base, 1);
      g.fillRect(0, 0, 64, 60);
      g.fillStyle(stripe, 1);
      for (let i = 0; i < 64; i += 16) g.fillRect(i, 0, 6, 60);
      g.generateTexture(key, 64, 60);
    };
    make('forestTex', 0x4CAF50, 0x3d8b40);
    make('snowTex', 0xffffff, 0xd8ecf5);
    make('riverTex', 0x2266aa, 0x3a85d1);
  }

  currentObstacleEmoji() {
    if (this.currentBiome === 'forest') return '🪨';
    if (this.currentBiome === 'snow') return '❄️';
    return '🐊';
  }

  setAnimal(key, showNotice) {
    this.animalKey = key;
    this.animal = ANIMALS[key];
    this.player.setText(this.animal.emoji);
    this.maxJumps = this.animal.ability === 'doublejump' ? 2 : 1;
    this.jumpsUsed = 0;
    this.animalLabel.setText(this.animal.name + ' ' + this.animal.emoji);
    if (showNotice) {
      this.transformNotice.setText(this.animal.emoji + ' You became a ' + this.animal.name + '!');
      this.transformNotice.setVisible(true);
      this.time.delayedCall(1400, () => this.transformNotice.setVisible(false));
    }
  }

  updateBiome() {
    let newBiome = this.currentBiome;
    if (this.distance < BIOME_1_END) newBiome = 'forest';
    else if (this.distance < BIOME_2_END) newBiome = 'snow';
    else newBiome = 'river';

    if (newBiome !== this.currentBiome) {
      this.currentBiome = newBiome;
      if (newBiome === 'snow') { this.sky.setFillStyle(0xcfe8f3); this.ground.setTexture('snowTex'); this.biomeText.setText('❄️ Snow'); }
      else if (newBiome === 'river') { this.sky.setFillStyle(0x4a90d9); this.ground.setTexture('riverTex'); this.biomeText.setText('🌊 River'); }
      // Environment automatically transforms the animal
      this.setAnimal(BIOME_ANIMAL[newBiome], true);
    }
  }

  currentSpeed() {
    let mult = this.speedMultiplier;
    if (this.animal.ability === 'slide' && this.currentBiome === 'snow') mult *= 1.15;
    return BASE_SPEED * mult;
  }

  spawnObstacle() {
    if (this.gameOver || this.gameWon || this.choosing) return;
    const rock = this.add.text(WIDTH + 20, GROUND_Y - 30, this.currentObstacleEmoji(), { fontSize: '40px' }).setOrigin(0.5);
    this.physics.add.existing(rock);
    rock.body.setSize(35, 35);
    rock.body.setAllowGravity(false);
    rock.body.setVelocityX(-this.currentSpeed());
    this.obstacles.add(rock);
  }

  spawnCoin() {
    if (this.gameOver || this.gameWon || this.choosing) return;
    const height = Phaser.Math.Between(0, 1) === 0 ? GROUND_Y - 30 : GROUND_Y - 110;
    const coin = this.add.text(WIDTH + 20, height, '🪙', { fontSize: '30px' }).setOrigin(0.5);
    this.physics.add.existing(coin);
    coin.body.setSize(28, 28);
    coin.body.setAllowGravity(false);
    coin.body.setVelocityX(-this.currentSpeed());
    this.coins.add(coin);
  }

  spawnOrb() {
    if (this.gameOver || this.gameWon || this.choosing) return;
    const orb = this.add.text(WIDTH + 20, GROUND_Y - 90, '🔮', { fontSize: '34px' }).setOrigin(0.5);
    this.physics.add.existing(orb);
    orb.body.setSize(30, 30);
    orb.body.setAllowGravity(false);
    orb.body.setVelocityX(-this.currentSpeed());
    this.orbs.add(orb);
  }

  spawnPowerUp() {
    if (this.gameOver || this.gameWon || this.choosing) return;
    const kind = Phaser.Math.Between(0, 1) === 0 ? 'shield' : 'speed';
    const emoji = kind === 'shield' ? '🛡️' : '⚡';
    const p = this.add.text(WIDTH + 20, GROUND_Y - 60, emoji, { fontSize: '32px' }).setOrigin(0.5);
    this.physics.add.existing(p);
    p.body.setSize(30, 30);
    p.body.setAllowGravity(false);
    p.body.setVelocityX(-this.currentSpeed());
    p.kind = kind;
    this.powerUps.add(p);
  }

  hitObstacle(playerObj, obstacle) {
    if (this.gameOver || this.gameWon || this.choosing) return;

    if (this.hasShield) {
      this.hasShield = false;
      obstacle.destroy();
      this.updateStatusText();
      return;
    }
    if (this.animal.ability === 'smash') {
      obstacle.destroy();
      this.score += 1;
      this.scoreText.setText('Coins: ' + this.score);
      return;
    }

    this.gameOver = true;
    this.physics.pause();
    this.messageText.setText('💥 Game Over!\nCoins: ' + this.score + '\nClick or press R to retry');
    this.messageText.setVisible(true);
  }

  collectCoin(playerObj, coin) {
    coin.destroy();
    this.score += 1;
    this.scoreText.setText('Coins: ' + this.score);
  }

  collectPowerUp(playerObj, p) {
    if (p.kind === 'shield') {
      this.hasShield = true;
    } else {
      this.speedMultiplier = 1.6;
      if (this.speedBoostTimer) this.speedBoostTimer.remove();
      this.speedBoostTimer = this.time.delayedCall(4000, () => { this.speedMultiplier = 1; this.updateStatusText(); });
    }
    p.destroy();
    this.updateStatusText();
  }

  updateStatusText() {
    let s = '';
    if (this.hasShield) s += '🛡️ Shield active  ';
    if (this.speedMultiplier > 1) s += '⚡ Speed boost!';
    this.statusText.setText(s);
  }

  collectOrb(playerObj, orb) {
    orb.destroy();
    if (this.choosing) return;
    this.openTransformChoice();
  }

  openTransformChoice() {
    this.choosing = true;
    this.physics.pause();

    const shuffled = Phaser.Utils.Array.Shuffle(ALL_KEYS.slice());
    const choices = shuffled.slice(0, 3);

    const overlay = this.add.rectangle(WIDTH/2, HEIGHT/2, WIDTH, HEIGHT, 0x000000, 0.75);
    const title = this.add.text(WIDTH/2, 90, '🔮 Spirit Orb! Choose your form:', { fontSize: '22px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    this.transformGroup = [overlay, title];

    const startX = WIDTH/2 - ((choices.length - 1) * 180) / 2;
    choices.forEach((key, i) => {
      const a = ANIMALS[key];
      const x = startX + i * 180;
      const y = 210;
      const box = this.add.rectangle(x, y, 150, 160, 0x333355).setStrokeStyle(3, 0x8866ff).setInteractive({ useHandCursor: true });
      const emoji = this.add.text(x, y - 40, a.emoji, { fontSize: '56px' }).setOrigin(0.5);
      const name = this.add.text(x, y + 10, a.name, { fontSize: '20px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
      const desc = this.add.text(x, y + 45, a.desc, { fontSize: '12px', fill: '#aaa', wordWrap: { width: 130 }, align: 'center' }).setOrigin(0.5);
      this.transformGroup.push(box, emoji, name, desc);

      box.on('pointerover', () => box.setFillStyle(0x4444aa));
      box.on('pointerout', () => box.setFillStyle(0x333355));
      box.on('pointerdown', () => {
        this.setAnimal(key, false);
        this.transformGroup.forEach(obj => obj.destroy());
        this.transformGroup = [];
        this.choosing = false;
        if (!this.gameOver && !this.gameWon) this.physics.resume();
      });
    });
  }

  update(time, delta) {
    if (this.gameOver || this.gameWon || this.choosing) return;

    const onGround = this.player.body.blocked.down || this.player.body.touching.down;
    const jumpKeyDown = this.cursors.up.isDown || this.spaceKey.isDown;

    if (jumpKeyDown && !this.jumpKeyWasDown) {
      if (onGround) { this.player.body.setVelocityY(this.animal.jumpVel); this.jumpsUsed = 1; }
      else if (this.jumpsUsed < this.maxJumps) { this.player.body.setVelocityY(this.animal.jumpVel * 0.85); this.jumpsUsed++; }
    }
    this.jumpKeyWasDown = jumpKeyDown;

    // Body stays level - no bounce. Only legs swing like a pendulum while grounded.
    if (onGround) {
      this.legAngle += delta * 0.02 * (this.currentSpeed() / BASE_SPEED);
      const swing = Math.sin(this.legAngle) * 28; // degrees
      this.legL.setAngle(swing);
      this.legR.setAngle(-swing);
      this.legL.setPosition(this.player.x - 6, this.player.y + 14);
      this.legR.setPosition(this.player.x + 6, this.player.y + 14);
      this.legL.setVisible(true); this.legR.setVisible(true);
    } else {
      this.legL.setVisible(false); this.legR.setVisible(false);
    }

    // Scroll ground texture for realistic forward movement
    this.ground.tilePositionX += (this.currentSpeed() * delta) / 1000;

    this.distance += (this.currentSpeed() * delta) / 1000;
    this.distanceText.setText('Distance: ' + Math.floor(this.distance) + ' / ' + FINISH_DISTANCE);
    this.updateBiome();

    this.obstacles.getChildren().forEach(o => { if (o.x < -50) o.destroy(); });
    this.coins.getChildren().forEach(c => { if (c.x < -50) c.destroy(); });
    this.orbs.getChildren().forEach(o => { if (o.x < -50) o.destroy(); });
    this.powerUps.getChildren().forEach(p => { if (p.x < -50) p.destroy(); });

    if (this.distance >= FINISH_DISTANCE) {
      this.gameWon = true;
      this.physics.pause();
      this.messageText.setText('🏁 You reached the Golden Crown!\nCoins: ' + this.score + '\nClick or press R to play again');
      this.messageText.setVisible(true);
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: WIDTH,
  height: HEIGHT,
  parent: 'game-container',
  backgroundColor: '#87CEEB',
  physics: { default: 'arcade', arcade: { gravity: { y: 900 }, debug: false } },
  scene: [GameScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
