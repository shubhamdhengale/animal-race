<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animal Rush: Wild Evolution - Prototype</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; display:flex; align-items:center; justify-content:center; height:100%; font-family: Arial, sans-serif; }
  #game-container { box-shadow: 0 0 30px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div id="game-container"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>

const WIDTH = 800;
const HEIGHT = 400;
const GROUND_Y = 340;
const FINISH_DISTANCE = 1500; // total distance to win
const GAME_SPEED = 220; // px/sec world scroll speed

let player, cursors, spaceKey;
let obstacles, coins;
let scoreText, distanceText, messageText;
let score = 0;
let distance = 0;
let gameOver = false;
let gameWon = false;
let obstacleTimer, coinTimer;

const config = {
  type: Phaser.AUTO,
  width: WIDTH,
  height: HEIGHT,
  parent: 'game-container',
  backgroundColor: '#87CEEB',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 900 }, debug: false }
  },
  scene: { preload, create, update }
};

new Phaser.Game(config);

function preload() {
  // No external assets needed - using emoji text objects instead
}

function create() {
  // Sky gradient background (simple rectangles as ground/sky)
  this.add.rectangle(WIDTH/2, HEIGHT/2, WIDTH, HEIGHT, 0x87CEEB);
  this.add.rectangle(WIDTH/2, GROUND_Y + 30, WIDTH, 60, 0x4CAF50);

  // Ground physics body (invisible, just for collision)
  const ground = this.physics.add.staticGroup();
  const groundRect = this.add.rectangle(WIDTH/2, GROUND_Y + 10, WIDTH, 20, 0x4CAF50, 0);
  ground.add(groundRect);

  // Player - Rabbit
  player = this.add.text(120, GROUND_Y - 40, '🐇', { fontSize: '48px' });
  this.physics.add.existing(player);
  player.body.setSize(40, 40);
  player.body.setCollideWorldBounds(true);
  player.body.setGravityY(0); // uses world gravity

  this.physics.add.collider(player, ground);

  // Groups for obstacles and coins
  obstacles = this.physics.add.group();
  coins = this.physics.add.group();

  // Collisions
  this.physics.add.overlap(player, obstacles, hitObstacle, null, this);
  this.physics.add.overlap(player, coins, collectCoin, null, this);

  // Input
  cursors = this.input.keyboard.createCursorKeys();
  spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

  // UI
  scoreText = this.add.text(16, 16, 'Coins: 0', { fontSize: '22px', fill: '#000', fontStyle: 'bold' });
  distanceText = this.add.text(16, 44, 'Distance: 0 / ' + FINISH_DISTANCE, { fontSize: '22px', fill: '#000', fontStyle: 'bold' });
  messageText = this.add.text(WIDTH/2, HEIGHT/2, '', { fontSize: '36px', fill: '#fff', fontStyle: 'bold', backgroundColor: '#000000aa', padding: {x:20,y:10} });
  messageText.setOrigin(0.5);
  messageText.setVisible(false);

  // Spawn obstacles and coins on timers
  obstacleTimer = this.time.addEvent({ delay: 1400, callback: spawnObstacle, callbackScope: this, loop: true });
  coinTimer = this.time.addEvent({ delay: 900, callback: spawnCoin, callbackScope: this, loop: true });

  // Restart on click/tap when game over
  this.input.on('pointerdown', () => {
    if (gameOver || gameWon) this.scene.restart();
  });
  this.input.keyboard.on('keydown-R', () => {
    if (gameOver || gameWon) this.scene.restart();
  });

  // reset state on scene restart
  score = 0; distance = 0; gameOver = false; gameWon = false;
}

function spawnObstacle() {
  if (gameOver || gameWon) return;
  const rock = this.add.text(WIDTH + 20, GROUND_Y - 30, '🪨', { fontSize: '40px' });
  this.physics.add.existing(rock);
  rock.body.setSize(35, 35);
  rock.body.setAllowGravity(false);
  rock.body.setVelocityX(-GAME_SPEED);
  obstacles.add(rock);
}

function spawnCoin() {
  if (gameOver || gameWon) return;
  const height = Phaser.Math.Between(0, 1) === 0 ? GROUND_Y - 30 : GROUND_Y - 110;
  const coin = this.add.text(WIDTH + 20, height, '🪙', { fontSize: '30px' });
  this.physics.add.existing(coin);
  coin.body.setSize(28, 28);
  coin.body.setAllowGravity(false);
  coin.body.setVelocityX(-GAME_SPEED);
  coins.add(coin);
}

function hitObstacle(playerObj, obstacle) {
  if (gameOver || gameWon) return;
  gameOver = true;
  this.physics.pause();
  obstacleTimer.remove();
  coinTimer.remove();
  messageText.setText('💥 Game Over!\nCoins: ' + score + '\nClick or press R to retry');
  messageText.setVisible(true);
}

function collectCoin(playerObj, coin) {
  coin.destroy();
  score += 1;
  scoreText.setText('Coins: ' + score);
}

function update(time, delta) {
  if (gameOver || gameWon) return;

  // Jump
  const onGround = player.body.blocked.down || player.body.touching.down;
  if ((cursors.up.isDown || spaceKey.isDown) && onGround) {
    player.body.setVelocityY(-480);
  }

  // Increase distance over time (simulates running speed)
  distance += (GAME_SPEED * delta) / 1000;
  distanceText.setText('Distance: ' + Math.floor(distance) + ' / ' + FINISH_DISTANCE);

  // Clean up off-screen objects
  obstacles.getChildren().forEach(o => { if (o.x < -50) o.destroy(); });
  coins.getChildren().forEach(c => { if (c.x < -50) c.destroy(); });

  // Win condition
  if (distance >= FINISH_DISTANCE) {
    gameWon = true;
    this.physics.pause();
    obstacleTimer.remove();
    coinTimer.remove();
    messageText.setText('🏁 You reached the Golden Crown!\nCoins: ' + score + '\nClick or press R to play again');
    messageText.setVisible(true);
  }
}
</script>
</body>
</html>
